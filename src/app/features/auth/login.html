<div class="min-h-screen flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-md">
    <div class="flex items-center gap-3 mb-8 justify-center">
      <div class="h-12 w-12 rounded-xl bg-primary/15 ring-1 ring-primary/30 flex items-center justify-center">
        <img
          src="/apolo/isotipo_blanco.svg"
          alt="Apolo"
          class="h-8 w-8 object-contain"
          draggable="false"
        />
      </div>
      <div>
        <p class="text-xl font-bold tracking-tight text-foreground">APOLO CONTROL</p>
        <p class="text-xs text-muted-foreground">Gestión de ventas energéticas</p>
      </div>
    </div>

    <form
      class="bg-card border border-border rounded-2xl p-7 flex flex-col gap-5 shadow-sm"
      [formGroup]="form"
      (ngSubmit)="submit()"
      novalidate
    >
      <header class="flex flex-col gap-1">
        <h1 class="text-lg font-semibold text-foreground">Inicia sesión</h1>
        <p class="text-sm text-muted-foreground">Accede con tu cuenta de Apolo</p>
      </header>

      <label class="flex flex-col gap-1.5">
        <span class="text-xs font-medium text-foreground/80">Email</span>
        <input
          type="email"
          autocomplete="email"
          formControlName="email"
          placeholder="tu@email.com"
          class="w-full rounded-lg border border-border bg-background px-3 py-2 text-sm text-foreground placeholder:text-muted-foreground/60 focus:outline-none focus:ring-2 focus:ring-primary/40"
        />
        @if (showError('email', 'required')) {
          <span class="text-xs text-danger-fg">El email es obligatorio</span>
        }
        @if (showError('email', 'email')) {
          <span class="text-xs text-danger-fg">El email no es válido</span>
        }
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="text-xs font-medium text-foreground/80">Contraseña</span>
        <input
          type="password"
          autocomplete="current-password"
          formControlName="password"
          placeholder="••••••••"
          class="w-full rounded-lg border border-border bg-background px-3 py-2 text-sm text-foreground placeholder:text-muted-foreground/60 focus:outline-none focus:ring-2 focus:ring-primary/40"
        />
        @if (showError('password', 'required')) {
          <span class="text-xs text-danger-fg">La contraseña es obligatoria</span>
        }
      </label>

      @if (errorMessage(); as msg) {
        <div
          class="rounded-lg border border-danger/30 bg-danger-soft px-3 py-2 text-sm text-danger-fg"
          role="alert"
        >
          {{ msg }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading() || form.invalid"
        class="inline-flex items-center justify-center gap-2 rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-primary-foreground transition-opacity hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        @if (loading()) {
          <ui-icon name="refresh-cw" [size]="16" />
          Entrando…
        } @else {
          Entrar
          <ui-icon name="arrow-up-right" [size]="16" />
        }
      </button>

      <p class="text-[11px] text-muted-foreground text-center">
        Usuario por defecto: <span class="font-mono">admin&#64;apolo.com</span> / <span class="font-mono">admin123</span>
      </p>
    </form>
  </div>
</div>
