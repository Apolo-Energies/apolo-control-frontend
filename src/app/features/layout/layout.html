<div class="flex h-screen overflow-hidden bg-body">
  <app-sidebar
    [sections]="sections()"
    [mobileOpen]="mobileOpen()"
    (closeMobile)="mobileOpen.set(false)"
    (logoutClick)="onLogout()"
  />
  <div class="flex-1 flex flex-col overflow-hidden">
    <app-header (sidebarToggle)="mobileOpen.update((v) => !v)" (logout)="onLogout()" />
    <main class="flex-1 overflow-y-auto px-4 lg:px-6 py-6">
      <router-outlet />
    </main>
  </div>
</div>
