@if (labels().length === 0) {
  <p class="text-sm text-muted-foreground py-6 text-center">{{ emptyLabel() }}</p>
} @else {
  <div class="w-full" (mouseleave)="onLeave()">
    <svg
      [attr.viewBox]="viewBox()"
      class="w-full overflow-visible"
      [attr.height]="H()"
      preserveAspectRatio="none"
    >
      <defs>
        @for (s of series(); track s.label; let i = $index) {
          <linearGradient [attr.id]="gradientIds()[i]" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   [attr.stop-color]="s.color" stop-opacity="0.22" />
            <stop offset="100%" [attr.stop-color]="s.color" stop-opacity="0" />
          </linearGradient>
        }
      </defs>

      <!-- Líneas de cuadrícula + etiquetas Y -->
      @for (tick of yTicks(); track tick) {
        <line
          [attr.x1]="56" [attr.x2]="540"
          [attr.y1]="yPos(tick)" [attr.y2]="yPos(tick)"
          stroke="currentColor" stroke-opacity="0.07" stroke-width="1"
        />
        <text
          x="52" [attr.y]="yPos(tick) + 4"
          text-anchor="end" font-size="11"
          fill="currentColor" opacity="0.45"
        >{{ formatY(tick) }}</text>
      }

      <!-- Relleno de área con degradado -->
      @for (s of series(); track s.label; let i = $index) {
        <path
          [attr.d]="smoothArea(s.values)"
          [attr.fill]="'url(#' + gradientIds()[i] + ')'"
        />
      }

      <!-- Líneas suaves -->
      @for (s of series(); track s.label) {
        <path
          [attr.d]="smoothPath(s.values)"
          fill="none"
          [attr.stroke]="s.color"
          stroke-width="2.5"
          stroke-linejoin="round"
          stroke-linecap="round"
        />
      }

      <!-- Puntos en cada dato -->
      @for (s of series(); track s.label) {
        @for (val of s.values; track $index; let i = $index) {
          <circle
            [attr.cx]="xPositions()[i]"
            [attr.cy]="yPos(val)"
            r="4"
            [attr.fill]="s.color"
            stroke="var(--color-card, #111)"
            stroke-width="2"
          />
        }
      }

      <!-- Guía vertical + puntos agrandados + tooltip en hover -->
      @if (hoveredIndex(); as hi) {
        <line
          [attr.x1]="xPositions()[hi]" [attr.x2]="xPositions()[hi]"
          [attr.y1]="24" [attr.y2]="bottom()"
          stroke="currentColor" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4 3"
        />
        @for (s of series(); track s.label) {
          <circle
            [attr.cx]="xPositions()[hi]"
            [attr.cy]="yPos(s.values[hi])"
            r="6" [attr.fill]="s.color"
            stroke="var(--color-card, #111)" stroke-width="2.5"
          />
        }
        <foreignObject
          [attr.x]="tooltipX(hi)"
          [attr.y]="24"
          width="140" height="90"
        >
          <div xmlns="http://www.w3.org/1999/xhtml"
            class="bg-foreground text-background text-xs rounded-xl shadow-2xl px-3 py-2.5 space-y-1 pointer-events-none">
            <p class="font-semibold opacity-75 text-[11px] mb-1.5">{{ labels()[hi] }}</p>
            @for (s of series(); track s.label) {
              <p class="flex items-center gap-2">
                <span class="inline-block w-2 h-2 rounded-full shrink-0" [style.background]="s.color"></span>
                <span class="opacity-60">{{ s.label }}</span>
                <span class="font-semibold ml-auto tabular-nums">{{ formatY(s.values[hi]) }}</span>
              </p>
            }
          </div>
        </foreignObject>
      }

      <!-- Áreas invisibles para hover -->
      @for (x of xPositions(); track $index; let i = $index) {
        <rect
          [attr.x]="x - plotW() / (labels().length || 1) / 2"
          [attr.y]="24"
          [attr.width]="plotW() / (labels().length || 1)"
          [attr.height]="plotH()"
          fill="transparent"
          (mouseenter)="onHover(i)"
        />
      }

      <!-- Etiquetas eje X -->
      @for (lbl of labels(); track lbl; let i = $index) {
        <text
          [attr.x]="xPositions()[i]"
          [attr.y]="bottom() + 20"
          text-anchor="middle" font-size="11"
          fill="currentColor" opacity="0.45"
        >{{ lbl }}</text>
      }
    </svg>

    <!-- Leyenda -->
    <div class="flex items-center justify-center gap-6 mt-1">
      @for (s of series(); track s.label) {
        <div class="flex items-center gap-2 text-xs text-muted-foreground">
          <svg width="24" height="10" viewBox="0 0 24 10">
            <line x1="0" y1="5" x2="16" y2="5" [attr.stroke]="s.color" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="20" cy="5" r="3.5" [attr.fill]="s.color" stroke="none"/>
          </svg>
          {{ s.label }}
        </div>
      }
    </div>
  </div>
}
