<div class="flex flex-col items-center justify-center text-center py-14 px-6">
  <div class="h-14 w-14 rounded-full bg-accent/40 text-muted-foreground flex items-center justify-center mb-4">
    <ui-icon [name]="icon()" [size]="26" />
  </div>
  <h3 class="text-base font-semibold text-foreground">{{ title() }}</h3>
  @if (description()) {
    <p class="text-sm text-muted-foreground mt-1 max-w-md">{{ description() }}</p>
  }
  <div class="mt-4">
    <ng-content />
  </div>
</div>
