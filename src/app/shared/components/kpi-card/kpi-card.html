<div
  class="bg-card border border-border rounded-xl p-5 flex flex-col hover:border-muted-foreground/30 transition-colors"
>
  <div class="flex items-center gap-3 mb-3">
    @if (icon()) {
      <div
        class="h-9 w-9 rounded-lg flex items-center justify-center"
        [ngClass]="iconBgClass()"
      >
        <ui-icon [name]="icon()!" [size]="18" />
      </div>
    }
    <span class="text-[12px] font-medium text-muted-foreground uppercase tracking-wide">
      {{ label() }}
    </span>
  </div>

  <p class="text-[28px] sm:text-[32px] font-bold leading-tight text-foreground">
    {{ value() }}
  </p>

  @if (sublabel()) {
    <p class="text-xs text-muted-foreground mt-2">{{ sublabel() }}</p>
  }

  @if (delta() != null) {
    <div class="mt-3 flex items-center gap-1.5 text-xs font-medium" [ngClass]="deltaClass()">
      <ui-icon [name]="deltaIcon()" [size]="14" />
      <span>{{ delta() }}</span>
      @if (deltaLabel()) {
        <span class="text-muted-foreground font-normal">{{ deltaLabel() }}</span>
      }
    </div>
  }
</div>
