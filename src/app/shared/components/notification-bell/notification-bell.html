<div class="relative">
  <button
    type="button"
    class="relative h-9 w-9 rounded-md text-muted-foreground hover:bg-accent hover:text-foreground flex items-center justify-center transition-colors"
    aria-label="Notificaciones"
    (click)="inbox.togglePanel(); $event.stopPropagation()"
  >
    <ui-icon name="bell" [size]="18" />
    @if (inbox.unreadCount() > 0) {
      <span
        class="absolute -top-0.5 -right-0.5 min-w-[16px] h-4 px-0.5 rounded-full bg-primary text-[10px] text-white flex items-center justify-center font-bold leading-none"
      >
        {{ inbox.unreadCount() > 9 ? '9+' : inbox.unreadCount() }}
      </span>
    }
  </button>

  @if (inbox.panelOpen()) {
    <app-notification-panel />
  }
</div>
