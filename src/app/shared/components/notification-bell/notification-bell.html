<div class="relative">
  <button
    type="button"
    [class]="inbox.unreadCount() > 0
      ? 'relative h-9 w-9 rounded-md text-danger-fg bg-danger/10 hover:bg-danger/20 flex items-center justify-center transition-all ring-2 ring-danger/60 ring-offset-1 ring-offset-background'
      : 'relative h-9 w-9 rounded-md text-muted-foreground hover:bg-accent hover:text-foreground flex items-center justify-center transition-colors'"
    aria-label="Notificaciones"
    (click)="inbox.togglePanel(); $event.stopPropagation()"
  >
    <ui-icon name="bell" [size]="18" />
    @if (inbox.unreadCount() > 0) {
      <span
        class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-danger text-[10px] text-white flex items-center justify-center font-bold leading-none shadow-sm"
      >
        {{ inbox.unreadCount() > 9 ? '9+' : inbox.unreadCount() }}
      </span>
    }
  </button>

  @if (inbox.panelOpen()) {
    <app-notification-panel />
  }
</div>
