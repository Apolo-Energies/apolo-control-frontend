<div class="bg-card border border-border rounded-xl overflow-hidden" role="status" aria-busy="true" aria-label="Cargando datos">
  <div class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="bg-accent/30 text-xs uppercase tracking-wide text-muted-foreground">
        <tr>
          @for (col of colArray(); track col) {
            <th class="px-4 py-3 text-left">
              <div class="h-3 w-20 rounded bg-muted-foreground/20 animate-pulse"></div>
            </th>
          }
        </tr>
      </thead>
      <tbody class="divide-y divide-border/40">
        @for (row of rowArray(); track row) {
          <tr>
            @for (col of colArray(); track col) {
              <td class="px-4 py-3">
                <div
                  class="h-3.5 rounded bg-muted-foreground/15 animate-pulse"
                  [style.width.%]="(col % 3 === 0 ? 50 : col % 2 === 0 ? 80 : 65)"
                ></div>
              </td>
            }
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
