@if (labels().length === 0) {
  <p class="text-sm text-muted-foreground py-6 text-center">{{ emptyLabel() }}</p>
} @else {
  <div class="w-full" (mouseleave)="clearHover()">
    <svg
      [attr.viewBox]="viewBox()"
      class="w-full overflow-visible"
      [attr.height]="height()"
      preserveAspectRatio="none"
    >
      <!-- Líneas de cuadrícula + etiquetas Y -->
      @for (tick of yTicks(); track tick) {
        <line
          [attr.x1]="56" [attr.x2]="444"
          [attr.y1]="barY(tick)" [attr.y2]="barY(tick)"
          stroke="currentColor" stroke-opacity="0.07" stroke-width="1"
        />
        <text
          x="52" [attr.y]="barY(tick) + 4"
          text-anchor="end" font-size="10" fill="currentColor" opacity="0.5"
        >{{ formatY(tick) }}</text>
      }

      <!-- Barras agrupadas -->
      @for (lbl of labels(); track lbl; let g = $index) {
        @for (s of series(); track s.label; let si = $index) {
          <rect
            [attr.x]="barX(g, si)"
            [attr.y]="barY(s.values[g])"
            [attr.width]="barWidth()"
            [attr.height]="barH(s.values[g])"
            [attr.fill]="s.color"
            [attr.opacity]="hovered() && (hovered()!.group !== g || hovered()!.serie !== si) ? 0.35 : 1"
            rx="3"
            style="transition: opacity 0.15s"
            (mouseenter)="setHover(g, si)"
          />
        }

        <!-- Etiqueta eje X -->
        <text
          [attr.x]="groupX(g)"
          [attr.y]="barY(0) + 18"
          text-anchor="middle" font-size="10"
          fill="currentColor" opacity="0.5"
        >{{ lbl }}</text>
      }

      <!-- Tooltip -->
      @if (hovered(); as h) {
        <foreignObject
          [attr.x]="tooltipX(h.group)"
          [attr.y]="12"
          width="130" height="80"
        >
          <div xmlns="http://www.w3.org/1999/xhtml"
            class="bg-foreground text-background text-xs rounded-lg shadow-xl px-2.5 py-2 space-y-1 pointer-events-none">
            <p class="font-semibold opacity-80 mb-1">{{ labels()[h.group] }}</p>
            @for (s of series(); track s.label) {
              <p class="flex items-center gap-1.5">
                <span class="inline-block w-2 h-2 rounded-full shrink-0" [style.background]="s.color"></span>
                <span class="opacity-60">{{ s.label }}</span>
                <span class="font-semibold ml-auto">{{ formatY(s.values[h.group]) }}</span>
              </p>
            }
          </div>
        </foreignObject>
      }
    </svg>

    <!-- Leyenda -->
    <div class="flex items-center justify-center gap-6 mt-3">
      @for (s of series(); track s.label) {
        <div class="flex items-center gap-2 text-xs text-muted-foreground">
          <span class="w-3 h-3 rounded-sm inline-block shrink-0" [style.background]="s.color"></span>
          {{ s.label }}
        </div>
      }
    </div>
  </div>
}
