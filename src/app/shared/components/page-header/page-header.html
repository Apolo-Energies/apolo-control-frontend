<header class="mb-6 flex flex-wrap items-end justify-between gap-x-6 gap-y-3">
  <div class="min-w-0">
    <h1 class="text-2xl lg:text-3xl font-bold tracking-tight text-balance text-foreground">{{ title() }}</h1>
    @if (subtitle()) {
      <p class="text-sm text-muted-foreground mt-1">{{ subtitle() }}</p>
    }
  </div>
  <div class="flex flex-wrap items-center gap-2">
    <ng-content select="[secondary]" />
    <ng-content select="app-actions-menu" />
    <ng-content />
    <ng-content select="[primary]" />
  </div>
</header>
